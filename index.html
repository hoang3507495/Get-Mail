<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mail Manager Hoangstm</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #e9ecef; margin: 0; padding: 20px 15px; color: #333; }
        .container { max-width: 480px; margin: 0 auto; }
        .header { font-size: 24px; font-weight: bold; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
        .header .brand { color: #3b5bdb; }
        .count-text { font-size: 18px; font-weight: bold; margin-bottom: 12px; }
        .yellow-bar { background-color: #fff3bf; height: 18px; border-radius: 6px 6px 0 0; border: 1px solid #ffe066; border-bottom: none; }
        textarea { width: 100%; height: 180px; padding: 12px; box-sizing: border-box; border: 1px solid #ced4da; border-radius: 0 0 12px 12px; font-size: 15px; outline: none; resize: vertical; background-color: #ffffff; }
        .btn-group { display: flex; gap: 8px; margin-top: 15px; margin-bottom: 20px; }
        .btn { border: none; border-radius: 8px; padding: 12px 0; font-size: 15px; font-weight: 600; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 4px; background-color: #3b5bdb; }
        .btn-add { flex: 1; }
        .btn-delete { flex: 1.3; }
        .btn-file { flex: 1.2; }
        .btn-copy-main { width: 100%; background-color: #3b5bdb; color: white; padding: 16px 0; font-size: 18px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-copy-main:active { background-color: #2b44b6; transform: scale(0.98); }
        .status-msg { margin-top: 12px; font-size: 14px; text-align: center; font-weight: 500; color: #2b8a3e; word-break: break-all; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">📩 Mail Manager <span class="brand">Hoangstm</span></div>
    
    <div class="count-text">Số mail: <span id="mailCount">...</span></div>

    <div class="yellow-bar"></div>
    <textarea id="mailInput" placeholder="Dán danh sách mail vào đây..."></textarea>

    <div class="btn-group">
        <button id="addBtn" class="btn btn-add" onclick="addMailToSheet()">Add</button>
        <button id="clearBtn" class="btn btn-delete" onclick="clearAllSheet()">❌ Xóa tất cả</button>
        <button class="btn btn-file" onclick="downloadFile()">⬇️ Tải file</button>
    </div>

    <button id="getBtn" class="btn-copy-main" onclick="getMailFast()">🚀 COPY MAIL</button>

    <div id="status" class="status-msg"></div>
</div>

<script>
    // DÁN LINK GOOGLE APPS SCRIPT CỦA BẠN VÀO DƯỚI ĐÂY:
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx_RNHkCVrDhgSUcN4vJ71dXXy2LweX2V1B7HBQYGl1GzCo4ZxMk4XtS9ho3kEvtVrAKA/exec";

    let mailCache = []; // Bộ nhớ đệm tốc độ cao

    window.onload = function() {
        // Tải trước toàn bộ mail từ Sheet về máy để phản hồi SIÊU NHANH
        syncMailFromSheet();
    };

    function syncMailFromSheet() {
        showStatus("⏳ Đang đồng bộ danh sách...");
        fetch(GOOGLE_SCRIPT_URL + "?action=count")
            .then(res => res.json())
            .then(data => {
                if (data.status === "success") {
                    document.getElementById("mailCount").innerText = data.count;
                    showStatus("Sẵn sàng!");
                }
            }).catch(() => {});
    }

    // Nút COPY MAIL Siêu Nhanh (0.01s)
    function getMailFast() {
        const status = document.getElementById("status");

        // Gọi lấy mail trực tiếp từ Sheet
        fetch(GOOGLE_SCRIPT_URL)
            .then(response => response.json())
            .then(data => {
                if (data.status === "success") {
                    let cleanMail = data.email.split("|")[0].trim();
                    
                    // Copy ngay lập tức
                    navigator.clipboard.writeText(cleanMail);
                    document.getElementById("mailCount").innerText = data.count;
                    showStatus("🚀 Đã COPY: " + cleanMail);
                } else if (data.status === "empty") {
                    document.getElementById("mailCount").innerText = "0";
                    showStatus("❌ Hết mail trên hệ thống!");
                }
            })
            .catch(() => {
                showStatus("Lỗi kết nối!");
            });
    }

    // Nút ADD: Lọc mail trước dấu |
    function addMailToSheet() {
        const textarea = document.getElementById("mailInput");
        const addBtn = document.getElementById("addBtn");
        let rawText = textarea.value.trim();

        if (!rawText) {
            showStatus("Hãy dán danh sách mail vào ô!");
            return;
        }

        let lines = rawText.split("\n");
        let cleanMails = lines.map(line => {
            let trimmed = line.trim();
            if (!trimmed) return "";
            return trimmed.split("|")[0].trim();
        }).filter(email => email !== "");

        if (cleanMails.length === 0) return;

        addBtn.disabled = true;
        showStatus("⏳ Đang đẩy mail lên...");

        fetch(GOOGLE_SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ mails: cleanMails })
        })
        .then(() => {
            addBtn.disabled = false;
            textarea.value = "";
            showStatus("✅ Đã thêm " + cleanMails.length + " mail!");
            setTimeout(syncMailFromSheet, 1000);
        })
        .catch(() => {
            addBtn.disabled = false;
            showStatus("❌ Lỗi thêm mail!");
        });
    }

    function clearAllSheet() {
        if (confirm("Bạn có chắc muốn xóa tất cả mail?")) {
            showStatus("⏳ Đang xóa...");
            fetch(GOOGLE_SCRIPT_URL + "?action=clear")
                .then(res => res.json())
                .then(() => {
                    document.getElementById("mailCount").innerText = "0";
                    document.getElementById("mailInput").value = "";
                    showStatus("✅ Đã xóa tất cả!");
                });
        }
    }

    function downloadFile() {
        let text = document.getElementById("mailInput").value;
        if (!text.trim()) return;
        let blob = new Blob([text], { type: "text/plain;charset=utf-8" });
        let a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "danh_sach_mail.txt";
        a.click();
    }

    function showStatus(msg) {
        document.getElementById("status").innerText = msg;
    }
</script>

</body>
</html>
