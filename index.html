<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mail Manager Hoangstm</title>
    <!-- Nhúng thư viện Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #e9ecef; margin: 0; padding: 20px 15px; color: #333; }
        .container { max-width: 480px; margin: 0 auto; }
        .header { font-size: 24px; font-weight: bold; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
        .header .brand { color: #3b5bdb; }
        .count-text { font-size: 18px; font-weight: bold; margin-bottom: 12px; }
        .yellow-bar { background-color: #fff3bf; height: 18px; border-radius: 6px 6px 0 0; border: 1px solid #ffe066; border-bottom: none; }
        textarea { width: 100%; height: 180px; padding: 12px; box-sizing: border-box; border: 1px solid #ced4da; border-radius: 0 0 12px 12px; font-size: 15px; outline: none; resize: vertical; background-color: #ffffff; }
        .btn-group { display: flex; gap: 8px; margin-top: 15px; margin-bottom: 20px; }
        .btn { border: none; border-radius: 8px; padding: 12px 0; font-size: 15px; font-weight: 600; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 4px; background-color: #3b5bdb; }
        .btn:active { opacity: 0.8; }
        .btn-add { flex: 1; }
        .btn-delete { flex: 1.3; }
        .btn-file { flex: 1.2; }
        .btn-copy-main { width: 100%; background-color: #3b5bdb; color: white; padding: 16px 0; font-size: 18px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.2s; }
        .btn-copy-main:active { background-color: #2b44b6; transform: scale(0.98); }
        .btn-copy-main:disabled { background-color: #8296fd; cursor: not-allowed; }
        
        /* DÒNG HIỂN THỊ TÊN GMAIL (CHẠM VÀO TÊN MAIL LÀ TỰ COPY LẠI) */
        .copied-mail-text {
            margin-top: 15px;
            padding: 10px;
            font-size: 20px;
            font-weight: bold;
            color: #2b8a3e;
            text-align: center;
            word-break: break-all;
            cursor: pointer;
            border-radius: 6px;
            transition: background-color 0.2s;
            display: none;
        }
        .copied-mail-text:active {
            background-color: #d1e7dd;
        }

        .status-msg { margin-top: 12px; font-size: 15px; text-align: center; font-weight: bold; color: #495057; min-height: 22px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">📩 Mail Manager <span class="brand">Hoangstm</span></div>
    
    <div class="count-text">Số mail: <span id="mailCount">0</span></div>

    <div class="yellow-bar"></div>
    <textarea id="mailInput" placeholder="Dán danh sách mail vào đây (vd: mail|pass)..."></textarea>

    <div class="btn-group">
        <button id="addBtn" class="btn btn-add" onclick="addMails()">Add</button>
        <button id="clearBtn" class="btn btn-delete" onclick="clearAllMails()">❌ Xóa tất cả</button>
        <button class="btn btn-file" onclick="downloadFile()">⬇️ Tải file</button>
    </div>

    <button id="getBtn" class="btn-copy-main" onclick="copyAndRemoveMail()">🚀 COPY MAIL</button>

    <!-- TÊN GMAIL HIỆN PHÍA DƯỚI - BẤM VÀO LÀ COPY LẠI -->
    <div id="mailDisplay" class="copied-mail-text" onclick="reCopyMail()"></div>

    <div id="status" class="status-msg">Đang kết nối Firebase...</div>
</div>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyCCNUbvDucT2jrpm1lIhjpFxKD-kR7Ebe8",
      authDomain: "mailmanager-6d165.firebaseapp.com",
      databaseURL: "https://mailmanager-6d165-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "mailmanager-6d165",
      storageBucket: "mailmanager-6d165.firebasestorage.app",
      messagingSenderId: "509322392535",
      appId: "1:509322392535:web:cee24334137c05f1f05192",
      measurementId: "G-WBKT08PZYZ"
    };

    let isProcessing = false;
    let lastEmail = "";

    function showStatus(msg) {
        document.getElementById("status").innerText = msg;
    }

    try {
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        const db = firebase.database();
        const mailsRef = db.ref("mails");

        // Lắng nghe dữ liệu thời gian thực
        mailsRef.on("value", (snapshot) => {
            const data = snapshot.val();
            const count = data ? Object.keys(data).length : 0;
            document.getElementById("mailCount").innerText = count;

            if (count > 0) {
                showStatus("✅ Đã kết nối! Sẵn sàng sử dụng.");
            } else {
                showStatus("✅ Đã kết nối! Cơ sở dữ liệu trống.");
            }
        }, (error) => {
            showStatus("❌ Lỗi kết nối Firebase: " + error.message);
        });

        // 1. NÚT ADD
        window.addMails = function() {
            const textarea = document.getElementById("mailInput");
            let rawText = textarea.value.trim();

            if (!rawText) {
                showStatus("Hãy dán danh sách mail vào ô!");
                return;
            }

            let lines = rawText.split("\n");
            let cleanMails = lines.map(line => {
                let trimmed = line.trim();
                if (!trimmed) return "";
                return trimmed.split("|")[0].trim();
            }).filter(email => email !== "");

            if (cleanMails.length === 0) return;

            showStatus("⏳ Đang lưu mail...");

            let updates = {};
            cleanMails.forEach(email => {
                let newKey = mailsRef.push().key;
                updates[newKey] = email;
            });

            mailsRef.update(updates)
                .then(() => {
                    textarea.value = "";
                    showStatus("✅ Đã thêm " + cleanMails.length + " mail siêu tốc!");
                })
                .catch(err => showStatus("❌ Lỗi thêm mail: " + err.message));
        };

        // 2. NÚT COPY MAIL
        window.copyAndRemoveMail = function() {
            if (isProcessing) return;

            isProcessing = true;
            const btn = document.getElementById("getBtn");
            btn.disabled = true;

            mailsRef.limitToFirst(1).once("value", (snapshot) => {
                const data = snapshot.val();
                if (!data) {
                    showStatus("❌ Hết mail trên hệ thống!");
                    isProcessing = false;
                    btn.disabled = false;
                    return;
                }

                const key = Object.keys(data)[0];
                const targetRef = mailsRef.child(key);

                targetRef.transaction((currentValue) => {
                    if (currentValue !== null) {
                        return null; // Xóa mail trên Server
                    }
                    return;
                }, (error, committed, snapshot) => {
                    if (error) {
                        showStatus("❌ Lỗi hệ thống: " + error.message);
                        isProcessing = false;
                        btn.disabled = false;
                    } else if (!committed) {
                        isProcessing = false;
                        btn.disabled = false;
                        copyAndRemoveMail(); 
                    } else {
                        const email = snapshot.val();
                        lastEmail = email;

                        // Tự động copy
                        navigator.clipboard.writeText(email);

                        // Xóa dòng thông báo trạng thái, hiện tên Email bên dưới
                        showStatus(""); 
                        const displayEl = document.getElementById("mailDisplay");
                        displayEl.innerText = email;
                        displayEl.style.display = "block";

                        isProcessing = false;
                        btn.disabled = false;
                    }
                });
            });
        };

        // 3. BẤM VÀO TÊN EMAIL ĐỂ COPY LẠI
        window.reCopyMail = function() {
            if (!lastEmail) return;
            navigator.clipboard.writeText(lastEmail).then(() => {
                showStatus("✅ Đã copy lại: " + lastEmail);
            });
        };

        // 4. NÚT XÓA TẤT CẢ
        window.clearAllMails = function() {
            if (confirm("Bạn có chắc chắn muốn xóa tất cả mail trên hệ thống?")) {
                mailsRef.remove()
                    .then(() => {
                        document.getElementById("mailInput").value = "";
                        document.getElementById("mailDisplay").style.display = "none";
                        lastEmail = "";
                        showStatus("✅ Đã xóa sạch mail!");
                    })
                    .catch(err => showStatus("❌ Lỗi: " + err.message));
            }
        };

        // 5. NÚT TẢI FILE
        window.downloadFile = function() {
            let text = document.getElementById("mailInput").value;
            if (!text.trim()) {
                showStatus("Không có nội dung để tải!");
                return;
            }
            let blob = new Blob([text], { type: "text/plain;charset=utf-8" });
            let a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "danh_sach_mail.txt";
            a.click();
        };

    } catch (e) {
        showStatus("❌ Lỗi khởi tạo Code: " + e.message);
    }
</script>

</body>
</html>
