<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mail Manager Hoangstm</title>
    <!-- Nhúng thư viện Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #e9ecef; margin: 0; padding: 20px 15px; color: #333; }
        .container { max-width: 480px; margin: 0 auto; }
        .header { font-size: 24px; font-weight: bold; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
        .header .brand { color: #3b5bdb; }
        .count-text { font-size: 18px; font-weight: bold; margin-bottom: 12px; }
        .yellow-bar { background-color: #fff3bf; height: 18px; border-radius: 6px 6px 0 0; border: 1px solid #ffe066; border-bottom: none; }
        textarea { width: 100%; height: 180px; padding: 12px; box-sizing: border-box; border: 1px solid #ced4da; border-radius: 0 0 12px 12px; font-size: 15px; outline: none; resize: vertical; background-color: #ffffff; }
        .btn-group { display: flex; gap: 8px; margin-top: 15px; margin-bottom: 20px; }
        .btn { border: none; border-radius: 8px; padding: 12px 0; font-size: 15px; font-weight: 600; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 4px; background-color: #3b5bdb; }
        .btn:active { opacity: 0.8; }
        .btn-add { flex: 1; }
        .btn-delete { flex: 1.3; }
        .btn-file { flex: 1.2; }
        .btn-copy-main { width: 100%; background-color: #3b5bdb; color: white; padding: 16px 0; font-size: 18px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-copy-main:active { background-color: #2b44b6; transform: scale(0.98); }
        .btn-copy-main:disabled { background-color: #adb5bd; cursor: not-allowed; }
        .status-msg { margin-top: 15px; font-size: 18px; text-align: center; font-weight: bold; color: #2b8a3e; word-break: break-all; min-height: 24px; user-select: all; -webkit-user-select: all; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">📩 Mail Manager <span class="brand">Hoangstm</span></div>
    
    <div class="count-text">Số mail: <span id="mailCount">0</span></div>

    <div class="yellow-bar"></div>
    <textarea id="mailInput" placeholder="Dán danh sách mail vào đây (vd: mail|pass)..."></textarea>

    <div class="btn-group">
        <button id="addBtn" class="btn btn-add" onclick="addMails()">Add</button>
        <button id="clearBtn" class="btn btn-delete" onclick="clearAllMails()">❌ Xóa tất cả</button>
        <button class="btn btn-file" onclick="downloadFile()">⬇️ Tải file</button>
    </div>

    <!-- Nút Copy chính -->
    <button id="getBtn" class="btn-copy-main" onclick="copyAndRemoveMail()">🚀 COPY MAIL</button>

    <div id="status" class="status-msg"></div>
</div>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyCCNUbvDucT2jrpm1lIhjpFxKD-kR7Ebe8",
      authDomain: "mailmanager-6d165.firebaseapp.com",
      databaseURL: "https://mailmanager-6d165-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "mailmanager-6d165",
      storageBucket: "mailmanager-6d165.firebasestorage.app",
      messagingSenderId: "509322392535",
      appId: "1:509322392535:web:cee24334137c05f1f05192",
      measurementId: "G-WBKT08PZYZ"
    };

    try {
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        const db = firebase.database();
        const mailsRef = db.ref("mails");

        mailsRef.on("value", (snapshot) => {
            const data = snapshot.val();
            if (data) {
                document.getElementById("mailCount").innerText = Object.keys(data).length;
            } else {
                document.getElementById("mailCount").innerText = "0";
            }
        });

        window.addMails = function() {
            const textarea = document.getElementById("mailInput");
            let rawText = textarea.value.trim();
            if (!rawText) return;

            let lines = rawText.split("\n");
            let cleanMails = lines.map(line => {
                let trimmed = line.trim();
                if (!trimmed) return "";
                return trimmed.split("|")[0].trim();
            }).filter(email => email !== "");

            if (cleanMails.length === 0) return;

            let updates = {};
            cleanMails.forEach(email => {
                let newKey = mailsRef.push().key;
                updates[newKey] = email;
            });

            mailsRef.update(updates).then(() => {
                textarea.value = "";
                showStatus("Đã thêm " + cleanMails.length + " mail");
            });
        };

        let isProcessing = false;

        window.copyAndRemoveMail = function(resolveMailPromise = null) {
            const copyBtn = document.getElementById("getBtn");

            // Nếu bấm lần đầu
            if (!resolveMailPromise) {
                if (isProcessing) return;
                isProcessing = true;
                copyBtn.disabled = true;
                copyBtn.innerText = "⏳ Đang lấy...";

                if (navigator.clipboard && window.ClipboardItem) {
                    const mailPromise = new Promise((resolve) => {
                        resolveMailPromise = resolve; // CHỈ GIỮ LẠI RESOLVE, KHÔNG DÙNG REJECT
                    });

                    const item = new ClipboardItem({
                        'text/plain': mailPromise.then(text => new Blob([text], { type: 'text/plain' }))
                    });

                    navigator.clipboard.write([item]).catch(() => {});
                }
            }

            // Lấy ngẫu nhiên trong 5 mail đầu tiên để tránh xung đột
            mailsRef.limitToFirst(5).once("value", (snapshot) => {
                const data = snapshot.val();
                if (!data) {
                    if (resolveMailPromise) resolveMailPromise("");
                    showStatus("Hết mail!");
                    isProcessing = false;
                    copyBtn.disabled = false;
                    copyBtn.innerText = "🚀 COPY MAIL";
                    return;
                }

                const keys = Object.keys(data);
                const targetKey = keys[Math.floor(Math.random() * keys.length)];
                const emailValue = data[targetKey];

                db.ref("mails/" + targetKey).transaction((currentValue) => {
                    if (currentValue !== null) {
                        return null; // Xóa khỏi DB
                    }
                    return;
                }, (error, committed) => {
                    if (error || !committed) {
                        // NẾU XUNG ĐỘT: Đợi 30ms-80ms rồi gọi lại ngầm, GIỮ NGUYÊN PROMISE CŨ
                        const randomDelay = Math.floor(Math.random() * 50) + 30;
                        setTimeout(() => {
                            copyAndRemoveMail(resolveMailPromise);
                        }, randomDelay);
                    } else {
                        // THÀNH CÔNG: Đưa duy nhất địa chỉ Gmail vào khay nhớ tạm
                        if (resolveMailPromise) {
                            resolveMailPromise(emailValue);
                        } else if (navigator.clipboard && navigator.clipboard.writeText) {
                            navigator.clipboard.writeText(emailValue);
                        }

                        showStatus(emailValue);
                        isProcessing = false;
                        copyBtn.disabled = false;
                        copyBtn.innerText = "🚀 COPY MAIL";
                    }
                });
            });
        };

        window.clearAllMails = function() {
            if (confirm("Xóa toàn bộ mail?")) {
                mailsRef.remove().then(() => {
                    document.getElementById("mailInput").value = "";
                    showStatus("");
                });
            }
        };

        window.downloadFile = function() {
            let text = document.getElementById("mailInput").value;
            if (!text.trim()) return;
            let blob = new Blob([text], { type: "text/plain;charset=utf-8" });
            let a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "danh_sach_mail.txt";
            a.click();
        };

    } catch (e) {
        showStatus("Lỗi kết nối");
    }

    function showStatus(msg) {
        document.getElementById("status").innerText = msg;
    }
</script>

</body>
</html>
