<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mail Manager Hoangstm</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #e9ecef; margin: 0; padding: 20px 15px; color: #333; }
        .container { max-width: 480px; margin: 0 auto; }
        .header { font-size: 24px; font-weight: bold; margin-bottom: 8px; }
        .header .brand { color: #4361ee; }
        .count-text { font-size: 18px; font-weight: bold; margin-bottom: 12px; }
        .yellow-bar { background-color: #fff3bf; height: 18px; border-radius: 6px 6px 0 0; border: 1px solid #ffe066; border-bottom: none; }
        textarea { width: 100%; height: 160px; padding: 12px; box-sizing: border-box; border: 1px solid #ced4da; border-radius: 0 0 12px 12px; font-size: 15px; outline: none; resize: vertical; background-color: #ffffff; }
        .btn-group { display: flex; gap: 10px; margin-top: 15px; margin-bottom: 20px; }
        .btn { border: none; border-radius: 8px; padding: 12px 0; font-size: 15px; font-weight: 600; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px; flex: 1; }
        .btn-add { background-color: #3b5bdb; }
        .btn-add:disabled { background-color: #868e96; }
        .btn-copy-main { width: 100%; background-color: #3b5bdb; color: white; padding: 16px 0; font-size: 18px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; }
        .btn-copy-main:disabled { background-color: #868e96; }
        .status-msg { margin-top: 12px; font-size: 14px; text-align: center; font-weight: 500; color: #2b8a3e; word-break: break-all; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">📩 Mail Manager <span class="brand">Hoangstm</span></div>
    
    <div class="count-text">Số mail trên Sheet: <span id="mailCount">...</span></div>

    <div class="yellow-bar"></div>
    <textarea id="mailInput" placeholder="Dán danh sách mail vào đây (ví dụ: mail|pass)..."></textarea>

    <div class="btn-group">
        <button id="addBtn" class="btn btn-add" onclick="addMailToSheet()">Add vào Sheets</button>
    </div>

    <button id="getBtn" class="btn-copy-main" onclick="getMailFromSheet()">🚀 COPY MAIL</button>

    <div id="status" class="status-msg"></div>
</div>

<script>
    // DÁN LINK GOOGLE APPS SCRIPT CỦA BẠN VÀO GIỮA 2 DẤU NGOẶC KÉP BÊN DƯỚI:
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyXGaVQ11SqPM6uvdA1_NA-JjhFrzMEoxFXNsxZ8SmU3YXRq4lGHHSRg0-8Uy1wB5gF/exec";

    // Thêm Mail vào Google Sheets
    function addMailToSheet() {
        const textarea = document.getElementById("mailInput");
        const addBtn = document.getElementById("addBtn");
        const status = document.getElementById("status");
        let rawText = textarea.value.trim();

        if (!rawText) {
            showStatus("Hãy dán mail vào ô trước!");
            return;
        }

        // Tách dòng và lấy mail trước dấu |
        let lines = rawText.split("\n");
        let cleanMails = lines.map(line => line.trim().split("|")[0].trim()).filter(email => email !== "");

        if (cleanMails.length === 0) return;

        addBtn.disabled = true;
        showStatus("⏳ Đang tải mail lên Sheets...");

        fetch(GOOGLE_SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ mails: cleanMails })
        })
        .then(() => {
            addBtn.disabled = false;
            textarea.value = "";
            showStatus("✅ Đã thêm " + cleanMails.length + " mail vào Sheets!");
        })
        .catch(err => {
            addBtn.disabled = false;
            showStatus("❌ Lỗi thêm mail: " + err);
        });
    }

    // Lấy 1 Mail từ Google Sheets
    function getMailFromSheet() {
        const getBtn = document.getElementById("getBtn");
        const status = document.getElementById("status");

        getBtn.disabled = true;
        showStatus("⏳ Đang lấy mail...");

        fetch(GOOGLE_SCRIPT_URL)
            .then(response => response.json())
            .then(data => {
                getBtn.disabled = false;
                if (data.status === "success") {
                    let cleanMail = data.email.split("|")[0].trim();
                    navigator.clipboard.writeText(cleanMail);
                    document.getElementById("mailCount").innerText = data.count;
                    showStatus("✅ Đã COPY: " + cleanMail);
                } else if (data.status === "empty") {
                    document.getElementById("mailCount").innerText = "0";
                    showStatus("❌ Hết mail trên hệ thống!");
                } else {
                    showStatus("Lỗi: " + data.message);
                }
            })
            .catch(err => {
                getBtn.disabled = false;
                showStatus("Lỗi kết nối!");
            });
    }

    function showStatus(msg) {
        document.getElementById("status").innerText = msg;
    }
</script>

</body>
</html>
